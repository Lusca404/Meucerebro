<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu cérebro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%23F0A818%22/></svg>">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#181848;--card:#1f2656;--line:#304878;--mut:#7890a8;--txt:#eef2f7;--amb:#f0a818;--bad:#ff7b7b;--r:8px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:var(--fs,15px)/1.55 Manrope,system-ui,sans-serif}
h1,h2,h3,.wm,.hero-t{font-family:var(--hf,Unbounded),Manrope,sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.hide{display:none!important}
.btn{background:var(--amb);color:#000;padding:.6rem 1.1rem;border-radius:var(--r);font-weight:800}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--mut);color:var(--txt);font-weight:600}
.btn.ghost:hover{border-color:var(--amb);color:var(--amb)}
input,select,textarea{background:#000;border:1px solid var(--line);border-radius:var(--r);padding:.65rem .8rem;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--amb);outline:0}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:.9rem 0 .3rem}
#login{min-height:100%;display:grid;grid-template-columns:1.15fr 1fr}
.lhero{position:relative;overflow:hidden;padding:clamp(1.5rem,5vw,4rem);display:flex;flex-direction:column;justify-content:space-between;gap:2rem;border-right:1px solid var(--line)}
.hero-t{font-size:clamp(44px,7vw,92px);line-height:1;font-weight:700;position:relative;z-index:1}
.lhero p{color:var(--mut);font-size:18px;max-width:28ch;position:relative;z-index:1}
.orb{position:absolute;width:min(46vw,420px);aspect-ratio:1;border-radius:50%;background:var(--amb);right:-110px;bottom:-110px}
.lform{background:#000;display:grid;place-items:center;padding:2rem}
.lbox{width:100%;max-width:340px}
.lbox h1{font-size:24px;font-weight:700}
.lbox p{color:var(--mut);margin-top:.2rem}
.lbox .btn{width:100%;margin-top:1.3rem;padding:.8rem}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin-top:.7rem}
.sw{margin-top:1rem;color:var(--mut);font-size:14px}
.sw button{color:var(--amb);font-weight:700}
#app{display:flex;flex-direction:column;height:100%}
.hdr{display:flex;align-items:center;gap:1rem;background:#000;border-bottom:1px solid var(--line);padding:0 clamp(1rem,3vw,2rem);height:62px;flex-shrink:0}
.wm{display:flex;align-items:center;gap:.6rem;font-size:15px;font-weight:700;white-space:nowrap}
.wm svg{width:28px;height:28px}
.tabs{display:flex;height:100%;margin-left:1rem}
.nav{display:flex;align-items:center;gap:.5rem;padding:0 1.1rem;height:100%;color:var(--mut);font-weight:700;border-top:3px solid transparent;border-bottom:3px solid transparent}
.nav:hover{color:var(--txt)}
.nav.on{color:var(--amb);border-bottom-color:var(--amb)}
.nav .n{font-size:12px;background:var(--line);color:var(--txt);padding:0 .45rem;border-radius:99px}
.n:empty{display:none}
.sp{flex:1}
.mini{color:var(--mut);font-size:13px;font-weight:600;padding:.4rem .6rem;border-radius:6px}
.mini:hover{color:var(--amb)}
main{flex:1;overflow:auto;padding:2rem clamp(1rem,4vw,3rem);width:100%;max-width:1320px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.top h2{font-size:26px;font-weight:700;line-height:1.15}
.top small{color:var(--mut)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.4rem}
.chip{padding:.35rem .85rem;border:1px solid var(--line);border-radius:6px;color:var(--mut);font-size:14px;font-weight:600}
.chip:hover{border-color:var(--mut)}
.chip.on{background:var(--amb);color:#000;border-color:var(--amb);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,290px),1fr));gap:1rem;align-items:start}
.card{--c:var(--line);background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);padding:1.1rem 1.1rem 1rem 1.2rem;display:flex;flex-direction:column;gap:.5rem;cursor:pointer;overflow:hidden}
.card.tc{background:color-mix(in srgb,var(--c) 14%,var(--card));border-color:color-mix(in srgb,var(--c) 35%,var(--line));border-left-color:var(--c)}
.card:hover{border-color:var(--mut);border-left-color:var(--c)}
.card.urgent{box-shadow:0 0 0 2px var(--amb)}
.card h3{font-size:16px;font-weight:600;line-height:1.35}
.card p{color:color-mix(in srgb,var(--mut) 70%,#fff);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.card.done h3{text-decoration:line-through;color:var(--mut)}
.card.done{opacity:.6}
.cv{width:calc(100% + 2.3rem);margin:-1.1rem -1.1rem .3rem -1.2rem;height:150px;object-fit:cover;display:block}
.info{font-size:13px;color:var(--mut);display:flex;gap:.9rem;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:800;padding:.1rem .55rem;border-radius:4px}
.tag.hot{background:var(--amb);color:#000}
.tag.ok{background:var(--mut);color:#000}
.tags{display:flex;gap:.4rem;flex-wrap:wrap}
.acts{display:flex;gap:.2rem;padding-top:.5rem;border-top:1px solid #ffffff1f;flex-wrap:wrap}
.acts button{font-size:13px;font-weight:600;color:var(--mut);padding:.3rem .55rem;border-radius:6px}
.acts button:hover{background:#ffffff14;color:var(--amb)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:2.5rem 1rem;text-align:center;color:var(--mut)}
.ed{display:grid;grid-template-columns:270px 1fr;gap:1rem;height:calc(100% - 4.6rem);min-height:420px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;padding:.5rem}
.it{display:block;width:100%;text-align:left;padding:.6rem .7rem;border-radius:6px;border-left:3px solid transparent}
.it:hover{background:#ffffff10}
.it.on{background:var(--line);border-left-color:var(--amb)}
.it b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it span{font-size:12px;color:var(--mut)}
.page{background:var(--bgp,#000);color:var(--fgp,#e6ebf2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;padding:1.2rem 1.6rem;min-height:0}
.page .ttl{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;font:600 22px var(--hf,Unbounded),sans-serif;padding:.2rem 0 .8rem}
.meta{display:flex;gap:.8rem;align-items:center;margin:.8rem 0;flex-wrap:wrap}
.meta label{margin:0}
.page select{color:#eef2f7}
.meta select{width:auto;max-width:100%;font-size:14px;padding:.4rem .6rem}
.rte{flex:1;overflow:auto;font:19px/1.8 "Source Serif 4",Georgia,serif;caret-color:var(--amb);padding:.4rem 0;min-height:240px;outline:0;word-break:break-word}
.rte:empty::before{content:attr(data-ph);color:var(--mut)}
.rte h1{font:700 30px/1.2 var(--hf,Unbounded),sans-serif;margin:.5em 0 .3em}
.rte h2{font:700 23px/1.25 var(--hf,Unbounded),sans-serif;margin:.5em 0 .3em}
.rte h3{font:700 18px/1.3 Manrope,sans-serif;margin:.5em 0 .2em}
.rte blockquote{border-left:4px solid var(--amb);padding-left:1rem;margin:.6em 0;font-style:italic;opacity:.9}
.rte ul,.rte ol{padding-left:1.5em}
.rte hr{border:0;border-top:2px solid var(--line);margin:1em 0}
.tbw{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:.3rem .5rem;margin-bottom:.6rem;color:var(--txt)}
.tb{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;padding:.25rem 0;font-size:13px}
.tb span{color:var(--mut);font-weight:700;margin:0 .2rem 0 .5rem}
.tb button{min-width:30px;height:30px;padding:0 .5rem;border:1px solid var(--line);border-radius:6px;color:var(--txt)}
.tb button:hover{border-color:var(--amb)}
.tb button.sq{min-width:0;width:22px;height:22px;padding:0;border-radius:50%;border:2px solid #fff3}
.tb button.snip{color:#000;font-weight:800;border:0}
.tb select{width:auto;height:30px;padding:.2rem .4rem;font-size:13px}
.tb input[type=color]{width:30px;height:30px;padding:0;border:0;background:none}
.tags:empty{display:none}
.tag.st{background:var(--line);color:var(--txt)}
.tag.tg{border:1px solid var(--line);color:var(--mut);font-weight:600}
.g3{display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,1fr);gap:.6rem}.g3 input,.g3 select{min-width:0}
.lv .grid{grid-template-columns:1fr}
.compact .card{padding:.7rem .8rem .7rem 1rem;gap:.3rem}
.compact .card p{-webkit-line-clamp:1}
.compact .cv{height:90px;width:calc(100% + 1.8rem);margin:-.7rem -.8rem .2rem -1rem}
.foot{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;padding-top:.6rem;border-top:1px solid var(--line)}
.foot button{color:var(--bad)}
dialog{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:1.5rem;width:min(580px,94vw);max-height:92vh;overflow:auto;margin:auto}
dialog::backdrop{background:#000c}
dialog h3{font-size:19px;font-weight:700}
.row{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.4rem;flex-wrap:wrap}
.chk{display:flex;gap:.5rem;align-items:center;color:var(--txt);font-size:14px;margin:.9rem 1.2rem 0 0}
.chk input{width:auto;accent-color:var(--amb)}
.cols{display:flex;gap:.5rem;flex-wrap:wrap}
.sq2{width:30px;height:30px;border-radius:6px;border:2px solid transparent}
.sq2.on{border-color:#fff;box-shadow:0 0 0 2px var(--amb)}
.inl{display:flex;gap:.5rem}.inl input{flex:1}
.lks{display:flex;flex-direction:column;gap:.3rem;margin-top:.5rem}
.lk{display:flex;justify-content:space-between;gap:.5rem;background:#000;border-radius:6px;padding:.35rem .7rem;font-size:14px}
.lk a{color:var(--amb);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk button,.th button{color:var(--bad)}
.ims{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:.5rem;margin-bottom:.5rem}
.th{position:relative}
.th img{width:100%;height:90px;object-fit:cover;border-radius:6px;display:block}
.th button{position:absolute;top:4px;right:4px;background:#000c;border-radius:50%;width:22px;height:22px;line-height:1}
@media(max-width:760px){
 .g3{grid-template-columns:64px 1fr}.g3>div:last-child{grid-column:1/-1}
 #login{grid-template-columns:1fr}
 .lhero{border-right:0;border-bottom:1px solid var(--line);min-height:250px}
 .orb{width:200px;right:-70px;bottom:-70px}
 .hdr{height:56px}
 #exp{display:none}
 .tabs{position:fixed;bottom:0;left:0;right:0;height:58px;background:#000;border-top:1px solid var(--line);margin:0;z-index:5}
 .nav{flex:1;justify-content:center;padding:0;border-bottom:0}
 .nav.on{border-top-color:var(--amb)}
 .nav .n{display:none}
 main{padding:1.2rem 1rem 5rem}
 .ed{grid-template-columns:1fr;height:auto}
 .list{max-height:170px}
 .page{min-height:420px}
}
</style>
</head>
<body>
<section id="login">
 <div class="lhero"><div class="hero-t">Meu<br>cérebro</div><p>Todas as suas ideias de conteúdo e roteiros, num lugar só.</p><i class="orb"></i></div>
 <div class="lform"><div class="lbox">
  <h1>Acesse sua conta</h1>
  <p id="lsub">Entre para ver suas ideias.</p>
  <label for="u">E-mail</label><input id="u" type="email" autocomplete="username">
  <label for="p">Senha</label><input id="p" type="password" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button class="btn" id="go">Entrar</button>
  <div class="sw"><span id="swt">Primeira vez aqui?</span> <button id="sw">Criar conta</button></div>
 </div></div>
</section>
<div id="app" class="hide">
 <header class="hdr">
  <div class="wm"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#F0A818"/><path d="M9.5 21c0-6.500 3-10 6.500-10s6.500 3.500 6.500 10" stroke="#000" stroke-width="2.600" fill="none" stroke-linecap="round"/><circle cx="16" cy="15" r="2.400" fill="#000"/></svg>Meu cérebro</div>
  <nav class="tabs">
   <button class="nav" data-tab="reel">Reels <span class="n" id="n-reel"></span></button>
   <button class="nav" data-tab="post">Posts <span class="n" id="n-post"></span></button>
   <button class="nav" data-tab="yt">YouTube <span class="n" id="n-yt"></span></button>
   <button class="nav" data-tab="scripts">Roteiros <span class="n" id="n-scripts"></span></button>
  </nav>
  <div class="sp"></div>
  <button class="mini" id="pf">Personalizar</button>
  <button class="mini" id="exp">Baixar backup</button>
  <button class="mini" id="out">Sair</button>
 </header>
 <main id="main"></main>
</div>
<dialog id="dlg">
 <h3 id="dt"></h3>
 <label for="f-t">Título</label><input id="f-t" maxlength="140">
 <div class="g3"><div><label for="f-e">Emoji</label><input id="f-e" maxlength="4" placeholder="🎬"></div>
 <div><label for="f-s">Status</label><select id="f-s"><option>Ideia</option><option>Roteirizando</option><option>Gravando</option><option>Editando</option><option>Postado</option></select></div>
 <div><label for="f-dt">Publicar em</label><input id="f-dt" type="date"></div></div>
 <label for="f-tg">Tags (separe por vírgula)</label><input id="f-tg" placeholder="humor, bastidores">
 <label>Cor do card</label><div class="cols" id="cols"></div>
 <label for="f-d">Descrição</label><textarea id="f-d" rows="5"></textarea>
 <label for="f-l">Links</label>
 <div class="inl"><input id="f-l" placeholder="Cole um link e tecle Enter"><button class="btn ghost" id="al">Adicionar</button></div>
 <div class="lks" id="lk"></div>
 <label>Imagens</label>
 <div class="ims" id="im"></div>
 <button class="btn ghost" id="ai">+ Adicionar imagens</button><input type="file" id="fi" accept="image/*" multiple class="hide">
 <div><label class="chk" style="display:inline-flex"><input type="checkbox" id="f-u"> Fazer logo</label><label class="chk" style="display:inline-flex"><input type="checkbox" id="f-x"> Feito</label></div>
 <div class="row"><button class="btn ghost" id="dl" style="margin-right:auto;color:var(--bad)">Excluir</button><button class="btn ghost" id="ds">Abrir roteiro</button><button class="btn ghost" id="cx">Cancelar</button><button class="btn" id="sv">Salvar</button></div>
</dialog>

<dialog id="pd"><h3>Personalizar o Meu cérebro</h3><div id="pb"></div>
 <div class="row"><button class="btn ghost" id="pr">Restaurar padrão</button><button class="btn" id="px">Pronto</button></div></dialog>

<script>
/* ===== CONFIGURAÇÃO: cole aqui os dados do seu projeto Firebase ===== */
const firebaseConfig={apiKey:'AIzaSyAyMlBpm3vELqO07UqHtoKy1KKg-0bHkZU',authDomain:'meucerebro-364ee.firebaseapp.com',projectId:'meucerebro-364ee',appId:'1:1033312524248:web:bfec4e97c9b529fd2b04ad'};
/* ==================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const TYPES={reel:'Reels',post:'Posts',yt:'Vídeos do YouTube'};
const NEW={reel:'Nova ideia de reel',post:'Nova ideia de post',yt:'Nova ideia de vídeo'};
const COLORS=['','#F0A818','#7890A8','#5B8DEF','#E5645A','#47C2A1','#B58CF0','#F2D06B'];
const configured=!firebaseConfig.apiKey.startsWith('COLE');
let fa=null,fs=null;
if(configured){firebase.initializeApp(firebaseConfig);fa=firebase.auth();fs=firebase.firestore()}
const ERR={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/email-already-in-use':'Esse e-mail já tem conta. Clique em Entrar.','auth/weak-password':'Use uma senha com 6+ caracteres.','auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.'};
let user=null,db={ideas:[],scripts:[]},tab='reel',filter='all',cur=null,w=null,isNew=false,mode='login';

const fail=e=>{if(e){console.error(e);alert('Não foi possível salvar: '+e.message)}};
const col=n=>fs.collection('users').doc(user.uid).collection(n);
const run=async f=>{try{await f()}catch(e){fail(e)}};
const upd=(t,id,p)=>run(()=>col(t).doc(id).update(p));

/* ---------- login ---------- */
function setMode(m){mode=m;const s=m==='signup';
 $('#go').textContent=s?'Criar conta':'Entrar';
 $('#lsub').textContent=s?'Crie seu acesso para guardar suas ideias.':'Entre para ver suas ideias.';
 $('#swt').textContent=s?'Já tem conta?':'Primeira vez aqui?';
 $('#sw').textContent=s?'Entrar':'Criar conta';$('#err').textContent=''}
$('#sw').onclick=()=>setMode(mode==='login'?'signup':'login');
async function auth(){
 const E=m=>$('#err').textContent=m;
 if(!configured)return E('Falta configurar o Firebase no começo do arquivo index.html.');
 const email=$('#u').value.trim(),password=$('#p').value;
 if(!email||password.length<6)return E('Informe o e-mail e uma senha com 6+ caracteres.');
 try{mode==='signup'?await fa.createUserWithEmailAndPassword(email,password):await fa.signInWithEmailAndPassword(email,password)}
 catch(x){E(ERR[x.code]||x.message)}
}
$('#go').onclick=auth;
$('#p').onkeydown=e=>{if(e.key==='Enter')auth()};
async function start(u){
 user=u;$('#login').classList.add('hide');$('#app').classList.remove('hide');
 $('#main').innerHTML='<div class="empty">Carregando suas ideias…</div>';
 try{const [a,b]=await Promise.all([col('ideas').get(),col('scripts').get()]);
  db.ideas=a.docs.map(d=>({...d.data(),id:d.id,links:d.data().links||[],images:d.data().images||[]}));
  db.scripts=b.docs.map(d=>({...d.data(),id:d.id}))}catch(e){fail(e)}
 try{const p=await col('settings').doc('prefs').get();if(p.exists){prefs={...DEF,...p.data()};applyPrefs()}}catch(e){}
 render();
}
$('#out').onclick=async()=>{await fa.signOut();location.reload()};

/* ---------- navegação ---------- */
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;filter='all';render()});
function render(){
 document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 for(const t in TYPES)$('#n-'+t).textContent=db.ideas.filter(i=>i.type===t&&!i.done).length||'';
 $('#n-scripts').textContent=db.scripts.length||'';
 tab==='scripts'?renderScripts():renderIdeas();
}

/* ---------- ideias ---------- */
function renderIdeas(){
 const all=db.ideas.filter(i=>i.type===tab);
 const F={all:'Todas',todo:'Pendentes',hot:'Fazer logo',done:'Feitas'};
 const l=all.filter(i=>filter==='all'||(filter==='todo'&&!i.done)||(filter==='hot'&&i.urgent&&!i.done)||(filter==='done'&&i.done))
  .sort((a,b)=>(a.done-b.done)||(b.urgent-a.urgent)||b.created_at.localeCompare(a.created_at));
 const pend=all.filter(i=>!i.done).length;
 $('#main').innerHTML=`
 <div class="top"><div><h2>${TYPES[tab]}</h2><small>${pend} pendente${pend===1?'':'s'} · ${all.length} no total</small></div>
 <button class="btn" data-a="new">+ ${NEW[tab]}</button></div>
 <div class="chips">${Object.entries(F).map(([k,v])=>`<button class="chip ${filter===k?'on':''}" data-f="${k}">${v}</button>`).join('')}</div>
 ${l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty">${all.length?'Nenhuma ideia neste filtro.':'Nenhuma ideia ainda. Anote a primeira antes que ela escape.'}</div>`}`;
}
function card(i){
 const hasS=db.scripts.some(x=>x.idea_id===i.id);
 return `<article class="card ${i.color?'tc':''} ${i.urgent&&!i.done?'urgent':''} ${i.done?'done':''}" style="--c:${i.color||'#304878'}" data-a="open" data-id="${i.id}">
 ${i.images[0]?`<img class="cv" src="${esc(i.images[0].u)}" loading="lazy" alt="">`:''}
 <div class="tags">${i.urgent&&!i.done?'<span class="tag hot">Fazer logo</span>':''}${i.done?'<span class="tag ok">Feito</span>':''}${i.status&&i.status!=='Ideia'?`<span class="tag st">${esc(i.status)}</span>`:''}${(i.tags||[]).map(t=>`<span class="tag tg">#${esc(t)}</span>`).join('')}</div>
 <h3>${i.emoji?esc(i.emoji)+' ':''}${esc(i.title)}</h3>${i.description?`<p>${esc(i.description)}</p>`:''}
 <div class="info">${i.date?`<span>${fmtD(i.date)}</span>`:''}${i.images.length?`<span>${i.images.length} ${i.images.length>1?'imagens':'imagem'}</span>`:''}${i.links.length?`<span>${i.links.length} ${i.links.length>1?'links':'link'}</span>`:''}${hasS?'<span>Tem roteiro</span>':''}</div>
 <div class="acts"><button data-a="done" data-id="${i.id}">${i.done?'↩ Reabrir':'✓ Feito'}</button><button data-a="hot" data-id="${i.id}">${i.urgent?'Tirar urgência':'Marcar fazer logo'}</button></div></article>`;
}

/* ---------- janela de detalhes ---------- */
function openDlg(i){
 isNew=!i;
 w=i?JSON.parse(JSON.stringify(i)):{id:uid(),type:tab,title:'',description:'',links:[],images:[],color:'',urgent:false,done:false,emoji:'',status:'Ideia',date:'',tags:[]};
 $('#dt').textContent=i?'Detalhes da ideia':NEW[tab];
 $('#f-t').value=w.title;$('#f-d').value=w.description;$('#f-u').checked=w.urgent;$('#f-x').checked=w.done;$('#f-l').value='';$('#f-e').value=w.emoji||'';$('#f-s').value=w.status||'Ideia';$('#f-dt').value=w.date||'';$('#f-tg').value=(w.tags||[]).join(', ');
 $('#dl').classList.toggle('hide',isNew);$('#ds').classList.toggle('hide',!['yt','reel'].includes(w.type));
 drawAll();$('#dlg').showModal();if(isNew)$('#f-t').focus();
}
function drawAll(){
 $('#cols').innerHTML=COLORS.map(c=>`<button data-c="${c}" class="sq2 ${w.color===c?'on':''}" title="${c?'Cor':'Sem cor'}" style="background:${c||'repeating-linear-gradient(45deg,#304878 0 4px,#181848 4px 8px)'}"></button>`).join('');
 $('#lk').innerHTML=w.links.map((u,n)=>`<div class="lk"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,''))}</a><button data-rl="${n}" aria-label="Remover link">✕</button></div>`).join('');
 $('#im').innerHTML=w.images.map((m,n)=>`<div class="th"><img data-oi="${n}" style="cursor:zoom-in" src="${esc(m.u)}" alt=""><button data-ri="${n}" aria-label="Remover imagem">✕</button></div>`).join('');
}
$('#cols').onclick=e=>{const b=e.target.closest('[data-c]');if(b){w.color=b.dataset.c;drawAll()}};
$('#lk').onclick=e=>{const b=e.target.closest('[data-rl]');if(b){w.links.splice(+b.dataset.rl,1);drawAll()}};
$('#im').onclick=e=>{const b=e.target.closest('[data-ri]');if(b){w.images.splice(+b.dataset.ri,1);return drawAll()}
 const t=e.target.closest('[data-oi]');if(t){const win=window.open('','_blank');fetch(w.images[+t.dataset.oi].u).then(r=>r.blob()).then(x=>{win.location=URL.createObjectURL(x)})}};
function addLink(){let v=$('#f-l').value.trim();if(!v)return;if(!/^https?:\/\//i.test(v))v='https://'+v;w.links.push(v);$('#f-l').value='';drawAll()}
$('#al').onclick=addLink;
$('#f-l').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addLink()}};
async function shrink(f){
 const bm=await createImageBitmap(f),k=Math.min(1,900/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
 c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 return c.toDataURL('image/jpeg',.72);
}
$('#ai').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{
 $('#ai').textContent='Enviando…';
 for(const f of e.target.files){
  try{w.images.push({u:await shrink(f)});
   if(w.images.reduce((a,m)=>a+m.u.length,0)>850000){w.images.pop();alert('Limite de imagens desta ideia atingido (cerca de 600 KB no total). Remova alguma para adicionar outra.');break}
   drawAll()}
  catch(x){alert('Não foi possível enviar "'+f.name+'": '+(x.message||'formato não suportado'))}
 }
 e.target.value='';$('#ai').textContent='+ Adicionar imagens';
};
async function saveIdea(){
 const t=$('#f-t').value.trim();if(!t){$('#f-t').focus();return null}
 const p={title:t,description:$('#f-d').value,links:w.links,images:w.images,color:w.color,urgent:$('#f-u').checked,done:$('#f-x').checked,emoji:$('#f-e').value.trim(),status:$('#f-s').value,date:$('#f-dt').value,tags:$('#f-tg').value.split(',').map(x=>x.trim().replace(/^#/,'')).filter(Boolean)};
 if(p.done)p.urgent=false;
 if(isNew){const row={id:w.id,type:w.type,...p,created_at:new Date().toISOString()};await run(()=>col('ideas').doc(row.id).set(row));db.ideas.push(row);isNew=false}
 else{Object.assign(db.ideas.find(x=>x.id===w.id),p);await upd('ideas',w.id,p)}
 return w.id;
}
$('#sv').onclick=async()=>{if(await saveIdea()){$('#dlg').close();render()}};
$('#cx').onclick=()=>$('#dlg').close();
$('#dl').onclick=async()=>{
 if(!confirm('Excluir esta ideia e suas imagens? Roteiros vinculados continuam salvos.'))return;
 const i=db.ideas.find(x=>x.id===w.id);
 await run(()=>col('ideas').doc(i.id).delete());
 db.ideas=db.ideas.filter(x=>x.id!==i.id);db.scripts.forEach(s=>{if(s.idea_id===i.id){s.idea_id=null;upd('scripts',s.id,{idea_id:null})}});
 $('#dlg').close();render();
};
$('#ds').onclick=async()=>{const id=await saveIdea();if(!id)return;
 const s=db.scripts.find(x=>x.idea_id===id)||await newScript(id,$('#f-t').value.trim());
 cur=s.id;tab='scripts';$('#dlg').close();render()};

async function newScript(ideaId,title){
 const s={id:uid(),title:title||'Roteiro sem título',body:'',theme:0,idea_id:ideaId||null,updated_at:new Date().toISOString()};
 await run(()=>col('scripts').doc(s.id).set(s));db.scripts.unshift(s);cur=s.id;return s;
}

/* ---------- cliques no conteúdo ---------- */
$('#main').addEventListener('click',async e=>{
 const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;return renderIdeas()}
 const b=e.target.closest('[data-a]');if(!b)return;
 const id=b.dataset.id,i=db.ideas.find(x=>x.id===id),a=b.dataset.a;
 if(a==='new')openDlg();
 else if(a==='open')openDlg(i);
 else if(a==='done'){i.done=!i.done;if(i.done)i.urgent=false;render();upd('ideas',id,{done:i.done,urgent:i.urgent})}
 else if(a==='hot'){i.urgent=!i.urgent;render();upd('ideas',id,{urgent:i.urgent})}
 else if(a==='newscript'){await newScript();render()}
 else if(a==='pick'){cur=id;renderScripts()}
 else if(a==='delscript'){if(confirm('Excluir este roteiro?')){const d=cur;db.scripts=db.scripts.filter(x=>x.id!==d);cur=null;render();run(()=>col('scripts').doc(d).delete())}}
});

/* ---------- roteiros ---------- */
const fmt=t=>new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
const fmtD=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
const THEMES=[['#000000','#e6ebf2','Preto'],['#181848','#eef2f7','Marinho'],['#304878','#f4f7fb','Royal'],['#f4efe3','#1b1b2b','Papel']];
const TCOL=['#ffffff','#F0A818','#7890A8','#5B8DEF','#E5645A','#47C2A1','#B58CF0','#000000'];
const HCOL=['#F2D06B','#F0A818','#47C2A1','#5ec8ff','#ff9ec4','transparent'];
const SNIP=[['Gancho','#F0A818'],['Cena','#5B8DEF'],['Fala','#47C2A1'],['Corte','#E5645A'],['Chamada','#B58CF0']];
const FONTS=[['Source Serif 4','Serifa'],['Manrope','Moderna'],['Caveat','Manuscrita'],['Unbounded','Display'],['Courier New','Máquina']];
let ed=null,saved=null;
document.addEventListener('selectionchange',()=>{const g=getSelection();if(ed&&g.rangeCount&&ed.contains(g.anchorNode))saved=g.getRangeAt(0).cloneRange()});
function clean(h){
 h=h||'';if(!/<[a-z][\s\S]*>/i.test(h))h=esc(h).replace(/\n/g,'<br>');
 const d=new DOMParser().parseFromString('<body>'+h,'text/html');
 d.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(n=>n.remove());
 d.body.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value))n.removeAttribute(a.name)}));
 return d.body.innerHTML;
}
function toolbar(){
 const B=(c,l,t)=>`<button data-x="${c}" title="${t}">${l}</button>`;
 const sel=(k,t,o)=>`<select data-xs="${k}" title="${t}"><option value="">${t}</option>${o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select>`;
 return `<div class="tb">
 ${sel('formatBlock','Estilo',[['p','Parágrafo'],['h1','Título'],['h2','Subtítulo'],['h3','Seção'],['blockquote','Citação']])}
 ${sel('fontName','Fonte',FONTS)}
 ${sel('fontSize','Tamanho',[['2','Pequeno'],['3','Normal'],['5','Grande'],['6','Enorme'],['7','Gigante']])}
 ${B('bold','<b>N</b>','Negrito')}${B('italic','<i>I</i>','Itálico')}${B('underline','<u>S</u>','Sublinhado')}${B('strikeThrough','<s>R</s>','Riscado')}
 ${B('insertUnorderedList','Lista','Lista com marcadores')}${B('insertOrderedList','1. 2.','Lista numerada')}
 ${B('justifyLeft','Esq.','Alinhar à esquerda')}${B('justifyCenter','Centro','Centralizar')}${B('justifyRight','Dir.','Alinhar à direita')}
 ${B('insertHorizontalRule','Linha','Linha divisória')}${B('removeFormat','Limpar','Limpar formatação')}${B('undo','Desfazer','Desfazer')}${B('redo','Refazer','Refazer')}</div>
 <div class="tb"><span>Cor</span>${TCOL.map(c=>`<button class="sq" data-xc="foreColor" data-v="${c}" style="background:${c}" title="Cor do texto"></button>`).join('')}<input type="color" data-xi="foreColor" title="Outra cor">
 <span>Marca-texto</span>${HCOL.map(c=>`<button class="sq" data-xc="hiliteColor" data-v="${c}" style="background:${c==='transparent'?'repeating-linear-gradient(45deg,#7890A8 0 3px,#000 3px 6px)':c}" title="${c==='transparent'?'Remover marca-texto':'Marca-texto'}"></button>`).join('')}<input type="color" data-xi="hiliteColor" title="Outra cor">
 <span>Inserir</span>${SNIP.map(x=>`<button class="snip" data-sn="${x[0]}" data-v="${x[1]}" style="background:${x[1]}">${x[0]}</button>`).join('')}</div>`;
}
function item(x){const i=db.ideas.find(k=>k.id===x.idea_id);
 return `<button class="it ${x.id===cur?'on':''}" data-a="pick" data-id="${x.id}" ${i&&i.color?`style="border-left-color:${i.color}"`:''}><b>${esc(x.title)||'Sem título'}</b><span>${i?(i.type==='yt'?'YouTube: ':'Reel: ')+esc(i.title)+' · ':''}${fmt(x.updated_at)}</span></button>`}
function renderScripts(){
 if(!db.scripts.find(s=>s.id===cur))cur=db.scripts[0]?.id||null;
 const s=db.scripts.find(x=>x.id===cur),vids=db.ideas.filter(i=>i.type==='yt'||i.type==='reel'),T=THEMES[s?.theme||0]||THEMES[0];
 saved=null;
 $('#main').innerHTML=`
 <div class="top"><div><h2>Roteiros</h2><small>Para vídeos do YouTube e reels. Escreva, formate e vincule à ideia.</small></div><button class="btn" data-a="newscript">+ Novo roteiro</button></div>
 <div class="ed"><div class="list" id="sl">${db.scripts.length?db.scripts.map(item).join(''):'<div class="empty" style="border:0">Nenhum roteiro ainda.</div>'}</div>
 ${s?`<div class="page" id="pg" style="--bgp:${T[0]};--fgp:${T[1]}"><input class="ttl" id="st" value="${esc(s.title)}" placeholder="Título do roteiro" aria-label="Título">
  <div class="meta"><label for="sk">Ideia vinculada</label><select id="sk"><option value="">Sem vínculo</option>${vids.map(i=>`<option value="${i.id}" ${i.id===s.idea_id?'selected':''}>${i.type==='yt'?'YouTube':'Reel'}: ${esc(i.title)}</option>`).join('')}</select>
   <label for="sth">Papel</label><select id="sth">${THEMES.map((t,n)=>`<option value="${n}" ${n===(s.theme||0)?'selected':''}>${t[2]}</option>`).join('')}</select>
   <button class="btn ghost" id="tbt" style="margin-left:auto;padding:.35rem .8rem;font-size:13px"></button></div>
  <div class="tbw ${prefs.tbh?'hide':''}" id="tbar">${toolbar()}</div>
  <div class="rte" id="sb" contenteditable="true" spellcheck="true" data-ph="Comece o roteiro: gancho, cenas, falas, chamada para ação…"></div>
  <div class="foot"><span id="wc"></span><span id="ss">Salvo</span><button data-a="delscript">Excluir roteiro</button></div></div>`:'<div class="empty">Crie um roteiro para começar a escrever.</div>'}</div>`;
 if(!s)return;
 ed=$('#sb');ed.innerHTML=clean(s.body);
 const wc=()=>{const t=ed.innerText.trim(),n=t?t.split(/\s+/).length:0;$('#wc').textContent=n+' palavras · ~'+Math.max(1,Math.round(n/150))+' min de fala'};wc();
 let tm;const touch=()=>{s.updated_at=new Date().toISOString();$('#ss').textContent='Salvando…';clearTimeout(tm);
  tm=setTimeout(async()=>{await upd('scripts',s.id,{title:s.title,body:s.body,theme:s.theme||0,idea_id:s.idea_id,updated_at:s.updated_at});$('#ss').textContent='Salvo'},700)};
 const sync=()=>{s.body=ed.innerHTML;wc();touch()};
 const cmd=(c,v)=>{ed.focus();if(saved){const g=getSelection();g.removeAllRanges();g.addRange(saved)}
  document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,c==='formatBlock'?'<'+v+'>':v);sync()};
 ed.oninput=sync;
 ed.onpaste=e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'));};
 const tb=$('#tbar'),tbt=$('#tbt'),lab=()=>tbt.textContent=prefs.tbh?'Mostrar formatação':'Ocultar formatação';lab();
 tbt.onclick=()=>{prefs.tbh=!prefs.tbh;tb.classList.toggle('hide',prefs.tbh);lab();savePrefs()};
 tb.onmousedown=e=>{if(!e.target.closest('select,input'))e.preventDefault()};
 tb.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.x)cmd(d.x);else if(d.xc)cmd(d.xc,d.v);
  else if(d.sn)cmd('insertHTML',`<span style="background:${d.v};color:#000;font-weight:800;font-size:.72em;font-family:Manrope,sans-serif;padding:2px 9px;border-radius:5px">${d.sn}</span>&nbsp;`)};
 tb.onchange=e=>{const t=e.target,d=t.dataset;if(!t.value)return;if(d.xs){cmd(d.xs,t.value);t.selectedIndex=0}else if(d.xi)cmd(d.xi,t.value)};
 $('#st').oninput=e=>{s.title=e.target.value;const el=document.querySelector('.it.on b');if(el)el.textContent=s.title||'Sem título';touch()};
 $('#sk').onchange=e=>{s.idea_id=e.target.value||null;touch();$('#sl').innerHTML=db.scripts.map(item).join('')};
 $('#sth').onchange=e=>{s.theme=+e.target.value;const T=THEMES[s.theme],p=$('#pg');p.style.setProperty('--bgp',T[0]);p.style.setProperty('--fgp',T[1]);touch()};
}

/* ---------- personalização do app ---------- */
const DEF={acc:'#F0A818',theme:'navy',hf:'Unbounded',rad:'8px',dens:'cozy',view:'grid',cw:'290px',fs:'15px'};
const TH={navy:['#181848','#1f2656','#304878','#7890a8'],black:['#000000','#0d1330','#304878','#7890a8'],royal:['#304878','#3a5589','#7890a8','#c3d0de']};
const PREFS=[
 ['acc','Cor de destaque',['#F0A818','#5ec8ff','#47C2A1','#B58CF0','#ff8fb8','#ff7b7b'].map(c=>[c,'Cor'])],
 ['theme','Fundo',[['navy','Azul-marinho'],['black','Preto'],['royal','Azul royal']]],
 ['hf','Fonte dos títulos',[['Unbounded','Unbounded'],['Manrope','Moderna'],['Source Serif 4','Serifa'],['Caveat','Manuscrita']]],
 ['rad','Cantos',[['2px','Retos'],['8px','Suaves'],['16px','Redondos']]],
 ['dens','Cards',[['cozy','Confortáveis'],['compact','Compactos']]],
 ['view','Layout dos cards',[['grid','Grade'],['list','Lista']]],
 ['cw','Largura dos cards',[['230px','Estreitos'],['290px','Médios'],['400px','Largos']]],
 ['fs','Tamanho do texto',[['14px','Pequeno'],['15px','Normal'],['17px','Grande']]]];
let prefs={...DEF};try{prefs={...DEF,...JSON.parse(localStorage.getItem('mc_prefs'))}}catch(e){}
function applyPrefs(){const R=document.documentElement.style,t=TH[prefs.theme]||TH.navy;
 R.setProperty('--amb',prefs.acc);R.setProperty('--bg',t[0]);R.setProperty('--card',t[1]);R.setProperty('--line',t[2]);R.setProperty('--mut',t[3]);
 R.setProperty('--hf','"'+prefs.hf+'"');R.setProperty('--r',prefs.rad);R.setProperty('--fs',prefs.fs);R.setProperty('--cw',prefs.cw);
 document.body.classList.toggle('compact',prefs.dens==='compact');document.body.classList.toggle('lv',prefs.view==='list')}
const savePrefs=()=>{try{localStorage.setItem('mc_prefs',JSON.stringify(prefs))}catch(e){}if(user)run(()=>col('settings').doc('prefs').set(prefs))};
function drawPrefs(){$('#pb').innerHTML=PREFS.map(([k,l,o])=>`<label>${l}</label><div class="cols">${o.map(([v,t])=>k==='acc'
 ?`<button class="sq2 ${prefs[k]===v?'on':''}" data-pk="${k}" data-pv="${v}" style="background:${v}" title="${t}"></button>`
 :`<button class="chip ${prefs[k]===v?'on':''}" data-pk="${k}" data-pv="${v}">${t}</button>`).join('')}</div>`).join('')}
$('#pb').onclick=e=>{const b=e.target.closest('[data-pk]');if(!b)return;prefs[b.dataset.pk]=b.dataset.pv;applyPrefs();savePrefs();drawPrefs()};
$('#pf').onclick=()=>{drawPrefs();$('#pd').showModal()};
$('#px').onclick=()=>$('#pd').close();
$('#pr').onclick=()=>{prefs={...DEF};applyPrefs();savePrefs();drawPrefs()};
applyPrefs();

/* ---------- backup ---------- */
$('#exp').onclick=()=>{const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));
 a.download='meu-cerebro-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()};

/* ---------- início ---------- */
if(configured)fa.onAuthStateChanged(u=>{if(u&&!user)start(u)});
else $('#err').textContent='Falta configurar o Firebase no começo do arquivo index.html.';
</script>
